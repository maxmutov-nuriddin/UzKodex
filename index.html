<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UzKodex — Все кодексы в одном месте</title>
    <meta name="description" content="Быстрый и умный поиск по уголовному и административному кодексам Узбекистана. PWA с оффлайн-доступом.">
    <meta name="theme-color" content="#0a0f18">

    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UzKodex">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo-container">
                <div class="logo-icon">UKX</div>
                <div class="logo-text">
                    <h1>UzKodex</h1>
                    <span id="logo-subtitle">Все кодексы в 1 месте</span>
                </div>
                <div class="lang-switch">
                    <button class="lang-btn active" data-lang="ru">RU</button>
                    <button class="lang-btn" data-lang="uz">UZ</button>
                </div>
            </div>

            <div class="search-wrapper">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Поиск: № статьи, название, текст, наказание..." autocomplete="off" spellcheck="false">
                    <button id="voice-btn" class="hidden" title="Голосовой поиск" aria-label="Голосовой поиск">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path fill="currentColor" d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                    <button id="clear-search" class="hidden" aria-label="Очистить">✕</button>
                </div>

                <div class="filters">
                    <button class="filter-btn active" data-type="all">Все</button>
                    <button class="filter-btn" data-type="uk">УК РУз</button>
                    <button class="filter-btn" data-type="ak">КоАО</button>
                </div>
            </div>
        </header>

        <main id="content-area">
            <div id="status-bar">
                <div class="status-left">
                    <span id="results-count">Загрузка статей...</span>
                    <span id="search-stats"></span>
                </div>
                <div class="status-right">
                    <button id="bm-toggle" class="bm-toggle-btn">❤ Избранное</button>
                    <select id="sort-select" aria-label="Сортировка">
                        <option value="relevance">По релевантности</option>
                        <option value="number">По номеру статьи</option>
                    </select>
                </div>
            </div>

            <div id="fuzzy-hint" class="hidden"></div>

            <div id="virtual-list"></div>

            <div id="empty-state" class="hidden">
                <div class="empty-icon">🔍</div>
                <h3>Ничего не найдено</h3>
                <p>Попробуйте изменить запрос или фильтры</p>
            </div>

            <div id="loading-skeletons">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </main>

        <div class="keyboard-hint" id="shortcut-hint">/ или Ctrl+K — поиск</div>
        <div id="toast-container"></div>
    </div>

    <!-- Article Modal -->
    <div id="modal-overlay" class="hidden">
        <div id="article-modal">
            <button id="close-modal" aria-label="Закрыть">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => {})
                    .catch(() => {});
            });
        }
    </script>
</body>
</html>
