<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UzKodex — Все кодексы в одном месте</title>
    <meta name="description" content="Быстрый и удобный поиск по уголовному и административному кодексам Узбекистана. Современное PWA приложение с оффлайн доступом.">
    <meta name="theme-color" content="#0a0f18">
    
    <!-- PWA meta tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UzKodex">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo-container">
                <div class="logo-icon">UKX</div>
                <div class="logo-text">
                    <h1>UzKodex</h1>
                    <span>Все кодексы в одном месте</span>
                </div>
            </div>
            <div class="search-wrapper">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Поиск по номеру статьи, названию или наказанию..." autocomplete="off">
                    <button id="clear-search" class="hidden">✕</button>
                </div>
                <div class="filters">
                    <button class="filter-btn active" data-type="all">Все</button>
                    <button class="filter-btn" data-type="uk">УК</button>
                    <button class="filter-btn" data-type="ak">АК</button>
                </div>
            </div>
        </header>

        <main id="content-area">
            <div id="status-bar">
                <span id="results-count">Загрузка статей...</span>
            </div>
            <div id="virtual-list">
                <!-- Articles will be rendered here via JS -->
            </div>
            <div id="empty-state" class="hidden">
                <div class="empty-icon">🔍</div>
                <h3>Ничего не найдено</h3>
                <p>Попробуйте изменить запрос или фильтры</p>
            </div>
            <div id="loading-skeletons">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </main>

        <div id="toast-container"></div>
    </div>

    <!-- Article Modal -->
    <div id="modal-overlay" class="hidden">
        <div id="article-modal">
            <button id="close-modal">✕</button>
            <div id="modal-content">
                <!-- Full article content here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
